<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/home.png" type="image/x-icon">

    <title>FAVICONS e IMAGENS</title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <h2>Spider-Man</h2>
    <!-- Tag para acrescentar imagens - img -->
    <div>
        <img src="imagens/spider.png" alt="Spider-Man" title="Spider-Man" align="right">
    </div>

    <h2>Spider-Man - com proporção de imagens</h2>
    <div>
        <img src="imagens/spider.png"
        alt="Spider-Man"
        title="Spider-Man"
        width="800px"
        height="600px"
        border-radius: 10px
        >
    </div>

    <h2>Spider-Man - com proporção de imagens com style</h2>
    <div>
        <img src="imagens/spider.png" 
        alt="Spider-Man'"
        title="Spider-Man'"
        style=
        "margin: 20px;
        width: 500px;
        height: 500px;
        background-image: url(imagens/spider.png);
        background-size: auto;
        background-repeat: repeat-y ;"
        >
    </div>
</body>
</html>
